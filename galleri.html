<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lillannas butik - Galleri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <header>
        <a href="index.html">
            <img src="images/logga.png" alt="Lillannas butik - logga" class="logga-image">
        </a>
    </header>

    <main>
    <div class="container mt-5">
        <h2 class="page-header-text">Galleri</h2>

        <div class="divider d-flex align-items-center justify-content-center position-relative" style="margin-bottom: 3rem;">
            <span class="line"></span>
            <span class="leaf">✿</span>
            <span class="line"></span>

            <div class="dropdown position-absolute end-0">
                <button class="menu-button dropdown-toggle" type="button" id="galleryMenu" data-bs-toggle="dropdown" aria-expanded="false">
                    Meny
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="galleryMenu" style="background-color: #f5f1e4;">
                    <li><a class="dropdown-item" href="index.html">Startsida</a></li>
                    <li><a class="dropdown-item" href="kontakt.html">Kontakt</a></li>
                </ul>
            </div>
        </div> <div class="row g-4" id="gallery-container"></div>
        
    </div> </main>

    <img src="images/background-flower.png" alt="Dekorativ bild med blommor" class="flower-corner-bottom-right">
    <img src="images/background-flower.png" alt="Dekorativ bild med blommor" class="flower-corner-top-left">
    <div class="modal fade" id="galleryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0">
            <div class="modal-body p-0 position-relative">
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close" style="z-index: 10;"></button>
                
                <img src="" id="modalImage" class="img-fluid rounded" alt="">

                <button class="btn position-absolute top-50 start-0 translate-middle-y text-white fs-1" onclick="changeImage(-1)" style="background: rgba(0,0,0,0.2); border-radius: 0 5px 5px 0;">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button class="btn position-absolute top-50 end-0 translate-middle-y text-white fs-1" onclick="changeImage(1)" style="background: rgba(0,0,0,0.2); border-radius: 5px 0 0 5px;">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
